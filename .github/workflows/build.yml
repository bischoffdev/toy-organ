name: Build & Package Audio Plugins

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform_name: macOS
          - os: windows-2022
            platform_name: Windows
          - os: ubuntu-22.04
            platform_name: Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RAW="${{ github.event.release.tag_name }}"
            VER="${RAW#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="0.1.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Building plugin version: $VER (from tag: ${{ github.event.release.tag_name }})"

      # Cache JUCE downloaded via FetchContent to dramatically speed up subsequent builds
      - name: Cache FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-fetchcontent-

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DORGAN_VERSION="${{ steps.ver.outputs.version }}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -A x64 -DORGAN_VERSION="${{ steps.ver.outputs.version }}"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DORGAN_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build Plugin (Release)
        run: |
          cmake --build build --config Release --parallel

      # Package artifacts for easy download
      - name: Stage Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          find build/ToyOrgan_artefacts -name "*.vst3" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.component" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.app" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.lv2" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          cp -R Soundsets artifacts/ 2>/dev/null || true
          cp install.sh artifacts/ 2>/dev/null || true
          cp install.command artifacts/ 2>/dev/null || true
          chmod +x artifacts/install.sh artifacts/install.command 2>/dev/null || true

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          find build/ToyOrgan_artefacts -name "*.vst3" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.exe" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.lv2" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          cp -R Soundsets artifacts/ 2>/dev/null || true
          cp install.bat artifacts/ 2>/dev/null || true

      - name: Stage Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          find build/ToyOrgan_artefacts -name "*.vst3" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.lv2" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -path "*/Standalone/*" -type f -executable -exec cp {} artifacts/ \; 2>/dev/null || true
          cp -R Soundsets artifacts/ 2>/dev/null || true
          cp install.sh artifacts/ 2>/dev/null || true
          chmod +x artifacts/install.sh 2>/dev/null || true

      - name: Upload Plugin Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LaxersazOrgan-${{ matrix.platform_name }}
          path: artifacts/
          if-no-files-found: warn

      - name: Attach Zip to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          cmake -E tar cf ../LaxersazOrgan-${{ matrix.platform_name }}.zip --format=zip .
          cd ..
          gh release upload "${{ github.event.release.tag_name }}" LaxersazOrgan-${{ matrix.platform_name }}.zip --clobber
