name: Build & Package Audio Plugins

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform_name: macOS
          - os: windows-2022
            platform_name: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache JUCE downloaded via FetchContent to dramatically speed up subsequent builds
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-fetchcontent-

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -A x64

      - name: Build Plugin (Release)
        run: |
          cmake --build build --config Release --parallel

      # Package artifacts for easy download
      - name: Stage Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          # Copy VST3, AU, and Standalone apps if present
          find build/ToyOrgan_artefacts -name "*.vst3" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.component" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.app" -exec cp -R {} artifacts/ \; 2>/dev/null || true

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          find build/ToyOrgan_artefacts -name "*.vst3" -exec cp -R {} artifacts/ \; 2>/dev/null || true
          find build/ToyOrgan_artefacts -name "*.exe" -exec cp -R {} artifacts/ \; 2>/dev/null || true

      - name: Upload Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ToyOrgan-${{ matrix.platform_name }}
          path: artifacts/
          if-no-files-found: warn
